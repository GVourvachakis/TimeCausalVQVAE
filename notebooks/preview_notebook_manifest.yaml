schema_version: 1
description: Curated executed-notebook preview pass for visual inspection only.
policy:
  branch: docs/executed-notebook-previews
  intended_for_merge_to_main: false
  training_allowed: false
  expensive_metrics_allowed: false
  commit_notebook_outputs_only: true
  excluded_committed_paths:
    - outputs/
    - wandb/
    - data/raw/
    - data/processed/
    - checkpoints/
    - "*.pt"
    - "*.pkl"
    - "*.npy"
    - "*.npz"
runtime_buckets:
  short: 1-5 minutes
  medium: 5-15 minutes
  long: 15-45 minutes
  unknown: estimate after first observed run
notebooks:
  - path: notebooks/benchmarks/hawkes_jump_dataset.ipynb
    priority: 10
    category: benchmark
    runtime_bucket: short
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs: []
    fallback_behavior: Generate only lightweight in-memory synthetic Hawkes/SVMHJD diagnostics.
  - path: notebooks/report/hawkes_jump_model_comparison.ipynb
    priority: 20
    category: report
    runtime_bucket: medium
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - outputs/hawkes_jump_continuous_ablation_comparison/aggregate_summary.json
      - outputs/hawkes_jump_matched_continuous_comparison/aggregate_summary.json
      - outputs/cs673_report_resources/hawkes_jump_metrics.csv
    fallback_behavior: Use registry metadata and display command templates when local summaries are missing.
  - path: notebooks/report/sp500_vix_report_figures.ipynb
    priority: 30
    category: report
    runtime_bucket: medium
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - outputs/per_experiment_final_evaluation/sp500_vix/conditional_standard_vq_additive_ar/path_metrics/paper_style_summary.json
      - outputs/cs673_report_resources/sp500_vix_metrics.csv
    fallback_behavior: Resolve the first available local report artefacts and skip missing figures.
  - path: notebooks/report/sample_geometry_diagnostics.ipynb
    priority: 40
    category: report
    runtime_bucket: medium
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - outputs/final_sample_geometry_report/
    fallback_behavior: Allow missing model batches and render available lightweight geometry summaries only.
  - path: notebooks/continuous/sp500_vix.ipynb
    priority: 50
    category: continuous
    runtime_bucket: short
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - data/processed/sp500vix/sp500vix_normalized.npy
      - outputs/sp500_vix_continuous/beta_cvae/
    fallback_behavior: Print guarded dry-run and evaluation commands without requiring local checkpoints.
  - path: notebooks/discrete/sp500_vix.ipynb
    priority: 60
    category: discrete
    runtime_bucket: short
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - data/processed/sp500vix/sp500vix_normalized.npy
      - outputs/sp500_vix_discrete/
    fallback_behavior: Print guarded tokenizer, prior, and evaluation commands; skip missing checkpoint-dependent plots.
  - path: notebooks/continuous/hawkes_jump.ipynb
    priority: 70
    category: continuous
    runtime_bucket: short
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - outputs/hawkes_jump_continuous_logreturn_identity/
    fallback_behavior: Generate lightweight synthetic diagnostics and print guarded comparator commands.
  - path: notebooks/discrete/hawkes_jump.ipynb
    priority: 80
    category: discrete
    runtime_bucket: short
    training_allowed: false
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs:
      - outputs/hawkes_jump_logreturn_robustness/
    fallback_behavior: Generate lightweight synthetic/token diagnostics and print guarded tokenizer and prior commands.

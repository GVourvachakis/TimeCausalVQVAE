schema_version: 1
description: Controlled full-output preview pass for all non-multidimensional notebooks.
policy:
  branch: docs/executed-notebook-previews
  intended_for_merge_to_main: false
  training_allowed: false
  evaluation_allowed: false
  full_output_preview: true
  expensive_metrics_allowed: false
  commit_notebook_outputs_only: true
  excluded_committed_paths:
    - outputs/
    - wandb/
    - data/raw/
    - data/processed/
    - checkpoints/
    - "*.pt"
    - "*.pkl"
    - "*.npy"
    - "*.npz"
runtime_buckets:
  short: 1-5 minutes
  medium: 5-15 minutes
  long: 15-45 minutes
  unknown: estimate after first observed run
notebooks:
  - path: notebooks/benchmarks/hawkes_jump_dataset.ipynb
    priority: 10
    category: benchmark
    runtime_bucket: short
    training_allowed: false
    evaluation_allowed: false
    full_output_preview: true
    expensive_metrics_allowed: false
    timeout_seconds: 3600
    required_local_outputs: []
    fallback_behavior: Skip missing local outputs gracefully and print commands.

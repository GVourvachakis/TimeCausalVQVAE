repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-ast
      - id: check-docstring-first
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff-check
        args: ["--fix"]
      - id: ruff-format
        name: ruff-format

  - repo: https://github.com/python-poetry/poetry
    rev: 2.0.0
    hooks:
      - id: poetry-check
      - id: poetry-lock

  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout
        entry: poetry run nbstripout
        language: system
        files: '\.ipynb$'

      - id: mypy
        name: mypy
        entry: poetry run mypy src/time_causal_vae
        language: system
        pass_filenames: false

      - id: commitizen-check
        name: commitizen-check
        entry: poetry run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
        pass_filenames: true

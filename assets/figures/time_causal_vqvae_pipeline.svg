<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Time-causal VQ-VAE architecture overview</title>
  <desc id="desc">Original sketch of the default time-causal VQ-VAE and continuous TC-VAE baseline workflows, with causal encoder, vector quantizer, token prior, decoder, latent codebook sketch, and diagnostics.</desc>
  <defs>
    <linearGradient id="cyanBox" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#19e5e8" />
      <stop offset="1" stop-color="#b9e6f4" />
    </linearGradient>
    <linearGradient id="latentBox" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffd0c8" />
      <stop offset="1" stop-color="#f5f7c7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4c4c4c" />
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #2d2d2d; }
      .subtitle { font: 15px Arial, sans-serif; fill: #555; }
      .panel { fill: #fff0dc; stroke: #6b4316; stroke-width: 3.5; }
      .panel-small { fill: #fff0dc; stroke: #6b4316; stroke-width: 3; }
      .module { fill: url(#cyanBox); stroke: #8c8c8c; stroke-width: 2.4; }
      .latent { fill: url(#latentBox); stroke: #8c8c8c; stroke-width: 2.2; }
      .quant { fill: #ffffff; stroke: #8c8c8c; stroke-width: 2; }
      .cube-front { fill: #3f76c9; stroke: #2f5597; stroke-width: 1.4; }
      .cube-side { fill: #2e5fae; stroke: #2f5597; stroke-width: 1.2; }
      .cube-top { fill: #6d9de5; stroke: #2f5597; stroke-width: 1.2; }
      .orange { fill: #ee7c2f; stroke: #bb5722; stroke-width: 1.3; }
      .green { fill: #6b9e35; stroke: #4f7728; stroke-width: 1; }
      .node { fill: #bfbfbf; stroke: #555; stroke-width: 1.6; }
      .node-text { font: italic 13px Georgia, serif; fill: #333; }
      .label { font: 700 15px Arial, sans-serif; fill: #2f2f2f; }
      .small { font: 12px Arial, sans-serif; fill: #4f4f4f; }
      .formula { font: italic 20px Georgia, serif; fill: #555; }
      .formula-small { font: italic 15px Georgia, serif; fill: #555; }
      .caption { font: 13px Arial, sans-serif; fill: #5e5e5e; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin-line { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #777; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
      .brace { stroke: #555; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff" />
  <text class="title" x="48" y="44">Time-causal VQ-VAE architecture</text>
  <text class="subtitle" x="48" y="68">Default one-dimensional financial path workflow with no-anticipation encoder, vector quantizer, causal token prior, and diagnostics</text>

  <rect class="panel" x="42" y="92" width="770" height="520" rx="62" />
  <text class="label" x="330" y="640">Time-Causal VQ-VAE</text>

  <text class="formula" x="82" y="133">X = (X₁, X₂, ..., Xₜ) ~ μdata</text>
  <path class="line" d="M205,142 V170" />

  <rect class="module" x="90" y="170" width="230" height="64" rx="10" />
  <text class="label" x="133" y="196">Time Causal Network</text>
  <text class="label" x="166" y="216">(Encoder)</text>

  <path class="line" d="M320,202 H394" />
  <g transform="translate(395 176)">
    <polygon class="cube-top" points="0,22 16,8 54,8 38,22" />
    <polygon class="cube-side" points="38,22 54,8 54,50 38,64" />
    <rect class="cube-front" x="0" y="22" width="38" height="42" />
    <text class="small" x="-8" y="83">causal conv</text>
  </g>
  <path class="line" d="M456,202 H505" />
  <rect class="orange" x="508" y="187" width="44" height="28" rx="4" />
  <text class="formula-small" x="488" y="239">zₑ,t = fφ(X≤t, c≤t)</text>

  <path class="line" d="M552,202 H592" />
  <rect class="quant" x="594" y="152" width="132" height="94" />
  <text class="label" x="601" y="140">Vector Quantizer</text>
  <g transform="translate(618 173)">
    <rect class="green" x="0" y="0" width="18" height="10" />
    <rect class="green" x="34" y="0" width="18" height="10" />
    <rect class="green" x="68" y="0" width="18" height="10" />
    <rect class="green" x="0" y="23" width="18" height="10" />
    <rect class="green" x="34" y="23" width="18" height="10" />
    <rect class="green" x="68" y="23" width="18" height="10" />
    <rect class="green" x="0" y="46" width="18" height="10" />
    <rect class="green" x="34" y="46" width="18" height="10" />
    <rect class="green" x="68" y="46" width="18" height="10" />
    <circle cx="43" cy="28" r="6" fill="#f08a2f" stroke="#bb5722" stroke-width="1.2" />
  </g>
  <text class="formula-small" x="588" y="270">qₜ = argminⱼ ||zₑ,t - eⱼ||²</text>
  <text class="formula-small" x="622" y="292">zq,t = e(qₜ)</text>

  <path class="line" d="M660,246 V332" />
  <rect class="latent" x="515" y="332" width="290" height="72" rx="12" />
  <text class="formula" x="545" y="361">Q = (q₁, q₂, ..., qₜ)</text>
  <text class="formula-small" x="550" y="386">discrete latent path in learned codebook E</text>

  <path class="line" d="M515,368 H430" />
  <g transform="translate(354 337)">
    <polygon class="cube-top" points="0,22 16,8 58,8 42,22" />
    <polygon class="cube-side" points="42,22 58,8 58,58 42,72" />
    <rect class="cube-front" x="0" y="22" width="42" height="50" />
    <text class="small" x="-8" y="92">ConvT decoder</text>
  </g>
  <path class="line" d="M354,368 H290" />
  <rect class="module" x="95" y="336" width="195" height="64" rx="10" />
  <text class="label" x="121" y="362">Time Causal Network</text>
  <text class="label" x="155" y="382">(Decoder)</text>
  <path class="line" d="M192,400 V438" />
  <text class="formula" x="82" y="468">Y = (Y₁, Y₂, ..., Yₜ) ~ μrec</text>

  <rect class="panel-small" x="858" y="106" width="368" height="250" rx="44" />
  <text class="label" x="978" y="378">Causal token generation</text>
  <text class="formula" x="906" y="158">Q̂ ~ pθ(qₜ | q₁:ₜ₋₁, c≤t)</text>
  <path class="line" d="M1040,170 V202" />
  <rect class="module" x="936" y="202" width="210" height="58" rx="10" />
  <text class="label" x="982" y="226">Causal Prior</text>
  <text class="small" x="974" y="246">AR token model</text>
  <path class="line" d="M1040,260 V292" />
  <rect class="module" x="936" y="292" width="210" height="52" rx="10" />
  <text class="label" x="984" y="314">Shared Decoder</text>
  <text class="small" x="991" y="333">X̂ ~ μgen</text>

  <rect class="panel-small" x="858" y="418" width="368" height="206" rx="38" />
  <text class="label" x="974" y="646">Continuous TC-VAE baseline</text>
  <text class="formula-small" x="900" y="468">qφ(Zₜ | X≤t, c≤t) = N(μₜ, σₜ²)</text>
  <text class="formula-small" x="924" y="498">Zₜ = μₜ + σₜ ⊙ εₜ</text>
  <path class="line" d="M1040,507 V535" />
  <rect class="module" x="934" y="535" width="214" height="54" rx="10" />
  <text class="label" x="973" y="557">Time Causal Decoder</text>
  <text class="small" x="993" y="576">continuous sample path</text>

  <rect class="quant" x="60" y="512" width="290" height="68" rx="10" />
  <text class="label" x="82" y="538">Diagnostics</text>
  <text class="small" x="82" y="558">financial distances, VIX buckets, no-leakage checks</text>
  <path class="dash" d="M192,468 V512" />
  <path class="dash" d="M1040,344 C1040,386 345,502 320,528" />
  <path class="dash" d="M1040,589 C1040,626 365,596 324,574" />

  <g transform="translate(910 28)">
    <text class="label" x="0" y="0">Causal information flow</text>
    <circle class="node" cx="28" cy="38" r="17" />
    <circle class="node" cx="108" cy="38" r="17" />
    <circle class="node" cx="188" cy="38" r="17" />
    <circle class="node" cx="28" cy="93" r="17" />
    <circle class="node" cx="108" cy="93" r="17" />
    <circle class="node" cx="188" cy="93" r="17" />
    <text class="node-text" x="18" y="43">x₁</text>
    <text class="node-text" x="98" y="43">x₂</text>
    <text class="node-text" x="178" y="43">x₃</text>
    <text class="node-text" x="18" y="98">q₁</text>
    <text class="node-text" x="98" y="98">q₂</text>
    <text class="node-text" x="178" y="98">q₃</text>
    <path class="thin-line" d="M28,55 V76" />
    <path class="thin-line" d="M108,55 V76" />
    <path class="thin-line" d="M188,55 V76" />
    <path class="thin-line" d="M45,45 L94,82" />
    <path class="thin-line" d="M125,45 L174,82" />
    <path class="thin-line" d="M45,42 L173,83" />
  </g>

  <path class="brace" d="M90,250 C90,268 105,268 105,286 H320 C320,268 335,268 335,250" />
  <text class="small" x="165" y="310">encoder network</text>
  <path class="brace" d="M95,416 C95,434 110,434 110,452 H290 C290,434 305,434 305,416" />
  <text class="small" x="151" y="494">decoder network</text>
</svg>

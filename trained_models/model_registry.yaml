schema_version: 1
generated:
  branch: research/per-experiment-model-selection
  timestamp_utc: "2026-05-17"
  source:
    - docs/experiments/per_experiment_model_selection_plan.md
    - docs/experiments/per_experiment_model_selection_results.md
    - docs/experiments/per_experiment_final_evaluation_results.md
  note: >
    Metadata registry only. Checkpoints, token tensors, generated paths, processed data,
    W&B artefacts, and output summaries are local or external and are not committed.
path_policy:
  weights_committed: false
  checkpoint_placeholder: local_outputs_only
  allowed_committed_paths:
    - configs/experiments
    - trained_models
  local_output_root: outputs
selection_policy:
  default_profile: balanced_market
  lower_is_better: true
  do_not_select_from_mmd_alone: true
  public_defaults_change_requires_explicit_metadata: true


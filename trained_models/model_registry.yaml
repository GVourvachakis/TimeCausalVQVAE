schema_version: 1
generated:
  branch: cleanup/public-final-registry-namespaces
  timestamp_utc: "2026-05-17"
  source:
    - trained_models/README.md
    - trained_models/black_scholes/model_card.md
    - trained_models/heston/model_card.md
    - trained_models/hawkes_jump/model_card.md
    - trained_models/pdv/model_card.md
    - trained_models/sp500_vix/model_card.md
  note: >
    Metadata registry only. Checkpoints, token tensors, generated paths, processed data,
    W&B artefacts, and output summaries are local or external and are not committed.
    Selected entries are current registry selections for public workflows, not universal
    mathematical optima.
path_policy:
  weights_committed: false
  checkpoint_placeholder: local_outputs_only
  allowed_committed_paths:
    - configs/experiments
    - trained_models
  local_output_root: outputs
selection_policy:
  default_profile: balanced_market
  lower_is_better: true
  do_not_select_from_mmd_alone: true
  public_defaults_change_requires_explicit_metadata: true
  selector_supports:
    - family
    - profile
    - metric


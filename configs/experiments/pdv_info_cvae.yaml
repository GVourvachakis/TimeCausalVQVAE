experiment:
  name: pdv_info_cvae
  dataset: path_dependent_volatility
  seed: 0
data:
  n_samples: 2560
  n_timesteps: 60
  data_dim: 1
  condition_dim: 1
  transform: log
  inverse_transform: exp
  condition_feature: r2_volatility_feature
model:
  objective: info_cvae
  encoder: conditional_residual_lstm
  decoder: conditional_residual_lstm
  conditioner: identity
  prior: real_nvp
  data_dim: 1
  data_length: 60
  latent_dim: 2
  latent_length: 60
  beta: 0.04
  alpha: 0.2
  encoder_hidden_dim: 16
  encoder_num_layers: 2
  decoder_hidden_dim: 16
  decoder_num_layers: 2
  prior_num_flows: 3
  prior_hidden_dim: 250
training:
  optimizer: adam
  learning_rate: 0.001
  train_batch_size: 256
  eval_batch_size: 256
  epochs: 200
  steps_saving: 20
  steps_predict: 20

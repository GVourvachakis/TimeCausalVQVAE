experiment:
  name: hawkes_jump_causal_token_prior_additive
  dataset: hawkes_jump
  seed: 0

data:
  tokenizer_dir: outputs/hawkes_jump_discrete/tokenizer/hawkes_jump_causal_vq_tokenizer_seed0
  token_data_dir: outputs/hawkes_jump_discrete/token_prior/tokens_standard

model:
  family: causal_token_prior
  codebook_size: 64
  sequence_length: 60
  token_embedding_dim: 128
  num_layers: 2
  num_heads: 4
  mlp_hidden_dim: 256
  dropout: 0.1
  bos_token_id: 64
  prediction_convention: bos_shifted_next_token
  condition_dim: 1
  condition_injection: additive

training:
  optimizer: adam
  learning_rate: 0.0003
  batch_size: 64
  eval_batch_size: 64
  epochs: 2

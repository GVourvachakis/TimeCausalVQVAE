experiment:
  name: hawkes_jump_beta_cvae
  dataset: hawkes_jump
  seed: 0
data:
  n_samples: 512
  n_timesteps: 60
  data_dim: 1
  condition_dim: 1
  transform: log
  inverse_transform: exp
  condition_feature: constant
  params:
    simulation_scheme: ogata
    seed: 0
    data_output: price
    dt: 0.0166666667
    drift: 0.0
    brownian_volatility: 0.18
    baseline_intensity: 3.0
    excitation: 2.0
    decay: 12.0
    mark_excitation: 20.0
    negative_jump_probability: 0.7
    severe_jump_probability: 0.08
    volatility_excitation: true
model:
  objective: beta_cvae
  encoder: conditional_residual_lstm
  decoder: conditional_residual_lstm
  conditioner: identity
  prior: real_nvp
  data_dim: 1
  data_length: 60
  latent_dim: 2
  latent_length: 60
  beta: 0.04
  encoder_hidden_dim: 16
  encoder_num_layers: 2
  decoder_hidden_dim: 16
  decoder_num_layers: 2
  prior_num_flows: 3
  prior_hidden_dim: 128
training:
  optimizer: adam
  learning_rate: 0.001
  train_batch_size: 64
  eval_batch_size: 64
  epochs: 2
  steps_saving: 1
  steps_predict: 1

experiment:
  name: sp500_vix_causal_token_prior_hidden128_native_recurrent
  dataset: sp500_vix
  seed: 99

data:
  tokenizer_dir: outputs/sp500_vix_discrete/vq_tokenizer_ablation/sp500_vix_causal_vq_tokenizer_hidden128_seed99
  token_data_dir: outputs/sp500_vix_discrete/token_prior/sp500_vix_causal_vq_tokenizer_hidden128_tokens
  base_data_dir: data/processed

model:
  family: causal_token_prior
  prior_type: native_recurrent
  codebook_size: 64
  sequence_length: 60
  token_embedding_dim: 128
  num_layers: 4
  num_heads: 4
  mlp_hidden_dim: 256
  dropout: 0.1
  bos_token_id: 64
  prediction_convention: bos_shifted_next_token
  condition_dim: 1
  condition_injection: additive
  recurrent_type: gru
  recurrent_hidden_dim: 128
  recurrent_num_layers: 1
  recurrent_dropout: 0.0

training:
  optimizer: adam
  learning_rate: 0.0003
  batch_size: 256
  eval_batch_size: 256
  epochs: 100

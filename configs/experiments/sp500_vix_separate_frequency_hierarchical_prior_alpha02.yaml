experiment:
  name: sp500_vix_separate_frequency_hierarchical_prior_alpha02
  dataset: sp500_vix
  seed: 0

data:
  token_data_dir: outputs/sp500_vix_discrete/token_prior/separate_freq_alpha02_tokens
  low_tokenizer_dir: outputs/sp500_vix_discrete/separate_frequency_tokenizer/low/sp500_vix_freq_low_alpha02_tokenizer
  high_tokenizer_dir: outputs/sp500_vix_discrete/separate_frequency_tokenizer/high/sp500_vix_freq_high_alpha02_tokenizer
  base_data_dir: data/processed

model:
  family: causal_token_prior
  prior_type: separate_frequency_hierarchical
  codebook_size: 64
  low_codebook_size: 64
  high_codebook_size: 64
  sequence_length: 60
  index_shape: [60, 2]
  token_embedding_dim: 128
  num_layers: 4
  num_heads: 4
  mlp_hidden_dim: 256
  dropout: 0.1
  bos_token_id: 64
  prediction_convention: bos_shifted_next_token
  condition_dim: 1
  condition_injection: additive

training:
  optimizer: adam
  learning_rate: 0.0003
  batch_size: 256
  eval_batch_size: 256
  epochs: 100

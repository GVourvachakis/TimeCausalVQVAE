experiment:
  name: pdv_causal_token_prior_additive
  dataset: path_dependent_volatility
  seed: 1

data:
  tokenizer_dir: outputs/pdv_discrete/tokenizer_utilization_ablation/pdv_tokenizer_utilization_pdv_causal_vq_tokenizer_codebook64_codebookdim16_seed0
  token_data_dir: outputs/pdv_discrete/token_prior/tokens_codebook64_codebookdim16

model:
  family: causal_token_prior
  codebook_size: 64
  sequence_length: 60
  token_embedding_dim: 128
  num_layers: 4
  num_heads: 4
  mlp_hidden_dim: 256
  dropout: 0.1
  bos_token_id: 64
  prediction_convention: bos_shifted_next_token
  condition_dim: 1
  condition_injection: additive

training:
  optimizer: adam
  learning_rate: 0.0003
  batch_size: 256
  eval_batch_size: 256
  epochs: 100
